{% extends "base.html" %}

{% block title %}Iniciar Sesión - WebApp Dinámica{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="ri-login-box-fill auth-icon"></i>
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de vuelta</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="ri-user-line"></i>
                    Nombre de Usuario
                </label>
                <input type="text" id="username" name="username" required 
                       placeholder="Tu nombre de usuario" autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="ri-lock-line"></i>
                    Contraseña
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Tu contraseña">
            </div>
            
            <div class="form-checkbox">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">
                    Recordarme
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="ri-login-box-line"></i>
                Iniciar Sesión
            </button>
            
            <div class="divider">
                <span>O prueba con</span>
            </div>
            
            <div class="demo-login">
                <button type="button" class="btn btn-secondary btn-block" onclick="fillDemo()">
                    <i class="ri-user-smile-line"></i>
                    Usuario Demo
                </button>
            </div>
        </form>
        
        <div class="auth-footer">
            <p>¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        </div>
    </div>
</div>

<script>
function fillDemo() {
    document.getElementById('username').value = 'demo';
    document.getElementById('password').value = 'demo123';
}
</script>
{% endblock %}
