{% extends "base.html" %}

{% block title %}Registro - WebApp Dinámica{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="ri-user-add-fill auth-icon"></i>
            <h2>Crear Cuenta</h2>
            <p>Únete a nuestra comunidad</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="ri-user-line"></i>
                    Nombre de Usuario
                </label>
                <input type="text" id="username" name="username" required 
                       placeholder="Elige un nombre único" autofocus>
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="ri-mail-line"></i>
                    Correo Electrónico
                </label>
                <input type="email" id="email" name="email" required 
                       placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="ri-lock-line"></i>
                    Contraseña
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Mínimo 6 caracteres">
                <div class="password-strength" id="passwordStrength"></div>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">
                    <i class="ri-lock-2-line"></i>
                    Confirmar Contraseña
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       placeholder="Repite tu contraseña">
            </div>
            
            <div class="form-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="ri-user-add-line"></i>
                Crear Cuenta
            </button>
        </form>
        
        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthBar = document.getElementById('passwordStrength');
    let strength = 0;
    let message = '';
    let color = '';
    
    if (password.length >= 6) strength++;
    if (password.length >= 10) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;
    
    switch(strength) {
        case 0:
        case 1:
            message = 'Débil';
            color = '#e74c3c';
            break;
        case 2:
        case 3:
            message = 'Media';
            color = '#f39c12';
            break;
        case 4:
        case 5:
            message = 'Fuerte';
            color = '#27ae60';
            break;
    }
    
    if (password.length > 0) {
        strengthBar.innerHTML = `<span style="color: ${color}">Fortaleza: ${message}</span>`;
    } else {
        strengthBar.innerHTML = '';
    }
});
</script>
{% endblock %}
