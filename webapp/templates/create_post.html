{% extends "base.html" %}

{% block title %}Crear Post - WebApp Dinámica{% endblock %}

{% block content %}
<div class="create-post-container">
    <div class="create-post-header">
        <h1>Crear Nuevo Post</h1>
        <p>Comparte tus ideas con la comunidad</p>
    </div>
    
    <form method="POST" action="{{ url_for('create_post') }}" class="create-post-form">
        <div class="form-group">
            <label for="title">
                <i class="ri-text"></i>
                Título del Post
            </label>
            <input type="text" id="title" name="title" required 
                   placeholder="Un título llamativo para tu post" autofocus>
        </div>
        
        <div class="form-group">
            <label for="content">
                <i class="ri-file-text-line"></i>
                Contenido
            </label>
            <textarea id="content" name="content" rows="10" required 
                      placeholder="Escribe aquí tu contenido..."></textarea>
            <div class="char-count">
                <span id="charCount">0</span> caracteres
            </div>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('posts') }}" class="btn btn-secondary">
                <i class="ri-arrow-left-line"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="ri-send-plane-line"></i> Publicar
            </button>
        </div>
    </form>
</div>

<script>
const contentTextarea = document.getElementById('content');
const charCount = document.getElementById('charCount');

contentTextarea.addEventListener('input', function() {
    charCount.textContent = this.value.length;
});
</script>
{% endblock %}
